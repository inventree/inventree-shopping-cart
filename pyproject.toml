#This file is used to package the ShoppingCart plugin.
#
#- It was generated by the InvenTree Plugin Creator tool - version 1.20.1
#- Ref: https://github.com/inventree/plugin_creator

[build-system]
requires = ["setuptools", "twine", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-shopping-cart"
description = "Collect purchase requests in a shopping cart, and consolidate them into purchase orders"
dynamic = ["version"]
authors = [
    { name = "Oliver Walters",email = "oliver.henry.walters@gmail.com" },
]
readme = "README.md"
license = "MIT"
keywords = ["inventree", "plugin"]
requires-python = ">=3.9"
dependencies = [
    # Enter your plugin library dependencies here
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]
[project.urls]
Homepage = "https://github.com/inventree/inventree-shopping-cart"

[project.entry-points."inventree_plugins"]
ShoppingCart = "shopping_cart.core:ShoppingCart"

[tool.setuptools.packages.find]
where = [""]

[tool.setuptools.dynamic]
version = {attr = "shopping_cart.PLUGIN_VERSION"} 

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "test.py",
    "tests",
    "venv",
    "env",
    ".venv",
    ".env",
]

src=["shopping_cart"]

[tool.ruff.lint]

ignore = [
    "I001",
    "PIE790",
    "RUF012"
]
